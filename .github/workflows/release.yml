name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.7.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version || true

      - name: Build local app bundle
        env:
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/clang-module-cache
          SWIFT_MODULECACHE_PATH: ${{ runner.temp }}/swift-module-cache
        run: ./build.sh

      - name: Package local DMG
        run: ./make_dmg.sh --local

      - name: Create checksums
        run: |
          cd dist
          shasum -a 256 KeyCount-*.dmg > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "KeyCount ${RELEASE_TAG}" \
            --generate-notes \
            dist/KeyCount-*.dmg \
            dist/SHA256SUMS
